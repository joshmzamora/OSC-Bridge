<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Loading Palm Cove Table Tennis…</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:#78d9e8;color:#083a54}
    body{display:grid;place-items:center;background:linear-gradient(#79d9ea 0 55%,#f7d88a 55%)}
    main{text-align:center;padding:28px;border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 20px 70px rgba(7,66,84,.22)}
    strong{display:block;font-size:1.35rem;margin-bottom:8px}.spinner{width:34px;height:34px;margin:18px auto 0;border:4px solid rgba(8,58,84,.18);border-top-color:#087f8c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main data-table-tennis-loader><strong>Palm Cove Table Tennis</strong><span>Preparing the resort court…</span><div class="spinner"></div></main>
  <script>
    (async () => {
      const showLoadError = (error) => {
        const message = String(error?.message || error || 'Unknown startup error');
        document.head.innerHTML = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Palm Cove Table Tennis · Load error</title>';
        document.body.innerHTML = '';
        const card = document.createElement('main');
        const title = document.createElement('strong');
        const detail = document.createElement('span');
        title.textContent = 'Could not load the court';
        detail.textContent = message;
        card.append(title, detail);
        document.body.append(card);
      };

      const runScript = (source, sourceName) => {
        const script = document.createElement('script');
        script.textContent = `${source}\n//# sourceURL=${sourceName}`;
        document.body.append(script);
      };

      try {
        const [html, css, core, game] = await Promise.all([
          Bridge.readTableTennisAsset('sketch/ping-pong.html'),
          Bridge.readTableTennisAsset('sketch/ping-pong.css'),
          Bridge.readTableTennisAsset('sketch/ping-pong-core.js'),
          Bridge.readTableTennisAsset('sketch/ping-pong.js'),
        ]);

        const parsed = new DOMParser().parseFromString(html, 'text/html');
        if (!parsed.querySelector('#gameShell')) throw new Error('The packaged court markup is incomplete.');
        parsed.querySelectorAll('script, link[rel="stylesheet"]').forEach((element) => element.remove());

        const nextHead = document.createElement('head');
        for (const child of parsed.head.children) nextHead.append(document.importNode(child, true));
        const style = document.createElement('style');
        style.dataset.tableTennisStyles = 'true';
        style.textContent = css;
        nextHead.append(style);

        const nextBody = document.importNode(parsed.body, true);
        document.documentElement.lang = parsed.documentElement.lang || 'en';
        document.head.replaceWith(nextHead);
        document.body.replaceWith(nextBody);

        runScript(core, 'palm-cove-table-tennis-core.js');
        runScript(game, 'palm-cove-table-tennis.js');

        await new Promise((resolve, reject) => {
          const deadline = performance.now() + 5000;
          const check = () => {
            if (globalThis.__TABLE_TENNIS_READY__) return resolve();
            if (performance.now() > deadline) return reject(new Error('The court loaded, but the game did not finish starting.'));
            requestAnimationFrame(check);
          };
          check();
        });
      } catch (error) {
        showLoadError(error);
      }
    })();
  </script>
</body>
</html>
