name: Check v2.2.1 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/check-v2-2-1-release.yml]

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture release and workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const runText = execFileSync('gh', ['run', 'list', '--repo', repo, '--limit', '20', '--json', 'databaseId,workflowName,status,conclusion,event,headBranch,headSha,url'], { encoding: 'utf8' });
          let release = null;
          try {
            release = JSON.parse(execFileSync('gh', ['release', 'view', 'v2.2.1', '--repo', repo, '--json', 'tagName,name,isDraft,isPrerelease,url,assets'], { encoding: 'utf8' }));
          } catch (error) {
            release = { error: String(error.message || error) };
          }
          fs.writeFileSync('release-v2-2-1-status.json', JSON.stringify({ runs: JSON.parse(runText), release }, null, 2));
          NODE
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-v2-2-1-status.json
          git commit -m "record v2.2.1 release status"
          git pull --rebase origin main
          git push origin HEAD:main
