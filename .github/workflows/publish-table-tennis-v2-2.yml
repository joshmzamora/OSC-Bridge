name: Publish Palm Cove Table Tennis v2.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-table-tennis-v2-2.yml

permissions:
  contents: write

jobs:
  validate-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare version metadata
        run: |
          npm version 2.2.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          if '## Unreleased' not in text:
              raise SystemExit('Unreleased changelog section is missing')
          path.write_text(text.replace('## Unreleased', '## 2.2.0', 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source and physics
        run: |
          npm run check
          npm test

      - name: Verify Electron renderer
        run: xvfb-run -a npm run e2e:table-tennis

      - name: Package Linux smoke build
        run: npx electron-builder --dir --linux

      - name: Commit and tag verified release
        run: |
          rm .github/workflows/publish-table-tennis-v2-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release Palm Cove Table Tennis v2.2.0"
          git tag -a v2.2.0 -m "OSC Bridge v2.2.0"
          git push origin HEAD:main
          git push origin v2.2.0
