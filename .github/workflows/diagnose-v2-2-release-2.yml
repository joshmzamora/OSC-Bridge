name: Diagnose v2.2.0 release again

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-v2-2-release-2.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --limit 12 --json databaseId,workflowName,status,conclusion,event,headBranch,headSha,url > release-v2-2-diagnose-2.json
          rm .github/workflows/diagnose-v2-2-release-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record current v2.2.0 workflow state"
          git push origin HEAD:main
