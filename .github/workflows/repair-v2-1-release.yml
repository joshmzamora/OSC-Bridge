name: Repair and verify OSC Bridge v2.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-v2-1-release.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Locate or launch installer workflow
        id: release_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --limit 30 \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch == "v2.1.0")][0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v2.1.0
            for attempt in $(seq 1 24); do
              sleep 5
              RUN_ID=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow release.yml \
                --limit 30 \
                --json databaseId,headBranch \
                --jq '[.[] | select(.headBranch == "v2.1.0")][0].databaseId // empty')
              [ -n "$RUN_ID" ] && break
            done
          fi

          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using installer workflow run $RUN_ID"

      - name: Wait for installer jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          exit 0

      - name: Require successful platform builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > /tmp/run.json
          SUCCESS_COUNT=$(jq '[.jobs[] | select(.name | startswith("build (")) | select(.conclusion == "success")] | length' /tmp/run.json)
          test "$SUCCESS_COUNT" = "3"

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.release_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.1.0 release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v2.1.0 release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "OSC Bridge v2.1.0"
          fi

      - name: Record verified release and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,displayTitle,headBranch,headSha,status,conclusion,url,jobs \
            > /tmp/run.json
          gh release view v2.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,publishedAt,url,assets \
            > /tmp/release.json

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile run /tmp/run.json \
            --slurpfile release /tmp/release.json \
            '{checkedAt: $checkedAt, installerRun: $run[0], release: $release[0]}' \
            > release-v2.1-status.json

          test "$(jq -r '.release.isDraft' release-v2.1-status.json)" = "false"
          test "$(jq -r '.release.isPrerelease' release-v2.1-status.json)" = "false"
          test "$(jq -r '.release.assets | length >= 4' release-v2.1-status.json)" = "true"

          rm .github/workflows/repair-v2-1-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          git commit -m "record verified v2.1.0 ping pong release"
          git push origin HEAD:main
