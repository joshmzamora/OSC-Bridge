name: Publish verified OSC Bridge v2.0.0 assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v2.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified installer artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: 30688433288
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.0.0 release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v2.0.0 release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "OSC Bridge v2.0.0"
          fi

      - name: Record verified release result
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: 30688433288
        run: |
          gh run view "$INSTALLER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,displayTitle,event,headBranch,headSha,status,conclusion,url,workflowName,jobs \
            > /tmp/run.json

          gh release view v2.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,publishedAt,url,assets \
            > /tmp/release.json

          ALL_BUILDS_SUCCESSFUL=$(jq '[.jobs[] | select(.name | startswith("build (")) | .conclusion == "success"] | length == 3 and all' /tmp/run.json)

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson allInstallerBuildsSuccessful "$ALL_BUILDS_SUCCESSFUL" \
            --slurpfile run /tmp/run.json \
            --slurpfile release /tmp/release.json \
            '{checkedAt: $checkedAt, allInstallerBuildsSuccessful: $allInstallerBuildsSuccessful, installerRun: $run[0], release: $release[0]}' \
            > release-status.json

          test "$(jq -r '.allInstallerBuildsSuccessful' release-status.json)" = "true"
          test "$(jq -r '.release.isDraft' release-status.json)" = "false"
          test "$(jq -r '.release.assets | length >= 4' release-status.json)" = "true"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json
          git commit -m "record successful v2.0.0 release"
          git pull --rebase origin main
          git push origin HEAD:main
