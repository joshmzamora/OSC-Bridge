name: Verify OSC Bridge v2.3.0 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-v2-3-0-release.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view v2.3.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets > release-v2-3-0-verified.json 2>/dev/null; then
              DRAFT=$(jq -r '.isDraft' release-v2-3-0-verified.json)
              PRERELEASE=$(jq -r '.isPrerelease' release-v2-3-0-verified.json)
              ASSETS=$(jq '.assets | length' release-v2-3-0-verified.json)
              WINDOWS=$(jq '[.assets[].name | select(. == "OSC.Bridge.Setup.2.3.0.exe")] | length' release-v2-3-0-verified.json)
              MAC_ARM=$(jq '[.assets[].name | select(. == "OSC.Bridge-2.3.0-arm64.dmg")] | length' release-v2-3-0-verified.json)
              MAC_INTEL=$(jq '[.assets[].name | select(. == "OSC.Bridge-2.3.0.dmg")] | length' release-v2-3-0-verified.json)
              LINUX=$(jq '[.assets[].name | select(. == "OSC.Bridge-2.3.0.AppImage")] | length' release-v2-3-0-verified.json)
              if [ "$DRAFT" = false ] && [ "$PRERELEASE" = false ] && [ "$ASSETS" -ge 4 ] && [ "$WINDOWS" = 1 ] && [ "$MAC_ARM" = 1 ] && [ "$MAC_INTEL" = 1 ] && [ "$LINUX" = 1 ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "v2.3.0 did not publish the expected installer set in time" >&2
          exit 1
      - name: Record verification and remove temporary workflow
        run: |
          rm .github/workflows/verify-v2-3-0-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-v2-3-0-verified.json .github/workflows/verify-v2-3-0-release.yml
          git commit -m "verify OSC Bridge v2.3.0 release"
          git pull --rebase origin main
          git push origin HEAD:main
