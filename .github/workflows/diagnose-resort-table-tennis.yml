name: Diagnose resort table tennis

on:
  push:
    branches: ["agent/resort-table-tennis"]
    paths:
      - .github/workflows/diagnose-resort-table-tennis.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/resort-table-tennis
      - name: Record recent workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch agent/resort-table-tennis --limit 10 --json databaseId,workflowName,status,conclusion,headSha,url,jobs > resort-table-tennis-runs.json
          rm .github/workflows/diagnose-resort-table-tennis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record table tennis workflow diagnostics"
          git push origin HEAD:agent/resort-table-tennis
