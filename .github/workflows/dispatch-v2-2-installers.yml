name: Dispatch v2.2.0 installers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v2-2-installers.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch installer build for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v2.2.0
      - name: Remove dispatcher
        run: |
          rm .github/workflows/dispatch-v2-2-installers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          git commit -m "dispatch v2.2.0 cross-platform installers"
          git push origin HEAD:main
