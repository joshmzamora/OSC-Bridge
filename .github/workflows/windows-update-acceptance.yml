name: Windows update acceptance

on:
  push:
    branches: [agent/automatic-updates]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-installed-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/automatic-updates
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build updater-enabled test version
        shell: pwsh
        run: |
          npm version 2.3.0 --no-git-tag-version
          npx electron-builder --win nsis --x64 --publish never
      - name: Download currently released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download v2.2.1 --repo $env:GITHUB_REPOSITORY --pattern 'OSC.Bridge.Setup.2.2.1.exe' --dir previous
      - name: Install and identify old version
        shell: pwsh
        run: |
          $old = Resolve-Path 'previous/OSC.Bridge.Setup.2.2.1.exe'
          $process = Start-Process -FilePath $old -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -notin @(0, 1641, 3010)) { throw "Old installer exited with $($process.ExitCode)" }
          Start-Sleep -Seconds 4
          Get-Process | Where-Object { $_.ProcessName -like 'OSC Bridge*' -or $_.ProcessName -eq 'osc_bridge' } | Stop-Process -Force -ErrorAction SilentlyContinue

          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $executables = @(Get-ChildItem $programs -Filter 'OSC Bridge.exe' -File -Recurse -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 1) {
            Get-ChildItem $programs -File -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Expected one installed OSC Bridge executable, found $($executables.Count)"
          }
          $executable = $executables[0].FullName
          $asarPath = Join-Path (Split-Path $executable) 'resources\app.asar'
          if (-not (Test-Path $asarPath)) { throw "Installed app.asar was not found at $asarPath" }
          $version = node -e "const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile(process.argv[1],'package.json').toString('utf8')); process.stdout.write(pkg.version);" $asarPath
          if ($version.Trim() -ne '2.2.1') { throw "Expected installed version 2.2.1, found $version" }
          "OSC_INSTALL_PATH=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install new version over old version
        shell: pwsh
        run: |
          $new = Resolve-Path 'dist/OSC.Bridge.Setup.2.3.0.exe'
          $process = Start-Process -FilePath $new -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -notin @(0, 1641, 3010)) { throw "New installer exited with $($process.ExitCode)" }
          Start-Sleep -Seconds 4
      - name: Verify same-path replacement and one installed copy
        shell: pwsh
        run: |
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $executables = @(Get-ChildItem $programs -Filter 'OSC Bridge.exe' -File -Recurse -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 1) {
            $executables | Select-Object FullName
            throw "Expected one OSC Bridge executable after replacement, found $($executables.Count)"
          }
          $executable = $executables[0].FullName
          if ([System.IO.Path]::GetFullPath($executable) -ne [System.IO.Path]::GetFullPath($env:OSC_INSTALL_PATH)) {
            throw "Update changed installation path from $env:OSC_INSTALL_PATH to $executable"
          }
          $asarPath = Join-Path (Split-Path $executable) 'resources\app.asar'
          $version = node -e "const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile(process.argv[1],'package.json').toString('utf8')); process.stdout.write(pkg.version);" $asarPath
          if ($version.Trim() -ne '2.3.0') { throw "Expected installed version 2.3.0 after replacement, found $version" }
      - name: Uninstall test application
        shell: pwsh
        run: |
          $installDirectory = Split-Path $env:OSC_INSTALL_PATH
          $uninstaller = Join-Path $installDirectory 'Uninstall OSC Bridge.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not found at $uninstaller" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -notin @(0, 1641, 3010)) { throw "Uninstaller exited with $($process.ExitCode)" }
      - name: Record successful acceptance and remove temporary workflow
        shell: pwsh
        run: |
          @{
            platform = 'windows-latest'
            previousVersion = '2.2.1'
            replacementVersion = '2.3.0'
            sameInstallationPath = $true
            installationCountAfterReplacement = 1
            result = 'success'
            verifiedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content windows-update-acceptance.json
          Remove-Item .github/workflows/windows-update-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows-update-acceptance.json .github/workflows/windows-update-acceptance.yml
          git commit -m 'verify Windows installer replacement'
          git pull --rebase origin agent/automatic-updates
          git push origin HEAD:agent/automatic-updates
