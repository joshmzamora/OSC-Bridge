name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Table-tennis renderer end-to-end smoke test
        run: xvfb-run -a npm run e2e:table-tennis
      - name: Package application smoke test
        run: npx electron-builder --dir --linux
