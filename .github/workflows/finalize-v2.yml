name: Finalize v2 repository

on:
  push:
    branches: ["agent/finalize-v2-release"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-v2-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final hardening changes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main/index.js')
          text = main.read_text()
          text = text.replace(
              "function buildAppleCertificateProfile(certificatePem, profileUUID, certificateUUID) {\n  const certificateBase64",
              "function buildAppleCertificateProfile(certificatePem, profileUUID, certificateUUID) {\n  const identifierSuffix = certificateUUID.toLowerCase();\n  const certificateBase64",
          )
          text = text.replace(
              '<string>com.joshmzamora.oscbridge.root</string>',
              '<string>com.joshmzamora.oscbridge.root.${identifierSuffix}</string>',
          )
          text = text.replace(
              '<string>com.joshmzamora.oscbridge.profile</string>',
              '<string>com.joshmzamora.oscbridge.profile.${identifierSuffix}</string>',
          )
          text = text.replace(
              'response.end(JSON.stringify({ ok: true, secureControllerUrl }));',
              'response.end(JSON.stringify({ ok: true }));',
          )
          main.write_text(text)

          controller = Path('controller/controller.js')
          text = controller.read_text()
          text = text.replace(
              """  socket.addEventListener('close', () => {
              setConnection('offline', 'Reconnecting');
              reconnectTimer = setTimeout(connect, reconnectDelay);
              reconnectDelay = Math.min(reconnectDelay * 1.7, 8000);
            });""",
              """  socket.addEventListener('close', (event) => {
              if (event.code === 1008) {
                setConnection('offline', 'Link expired');
                permissionNote.textContent = 'This pairing link expired. Scan the current QR code on the computer.';
                return;
              }
              setConnection('offline', 'Reconnecting');
              reconnectTimer = setTimeout(connect, reconnectDelay);
              reconnectDelay = Math.min(reconnectDelay * 1.7, 8000);
            });""",
          )
          controller.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          ci.write_text(ci.read_text().replace('- run: npm install\n', '- run: npm ci\n'))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          text = text.replace(
              '- Added QR pairing with a per-launch session token.\n',
              '- Added QR pairing with a per-launch session token.\n- Added guided iPhone certificate installation with persistent per-computer trust.\n',
          )
          text = text.replace(
              '- Added automated tests and GitHub Actions CI.\n',
              '- Added automated tests, packaging validation, and cross-platform release builds.\n',
          )
          changelog.write_text(text)

          release = '''name: Build release installers

          on:
            workflow_dispatch:
            push:
              tags: ["v*"]

          permissions:
            contents: write

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm ci
                - run: npm run check
                - run: npm test

            build:
              needs: test
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - os: windows-latest
                      build_args: --win nsis --x64
                      artifact_name: windows-installer
                      artifact_files: dist/*.exe
                    - os: macos-latest
                      build_args: --mac dmg --x64 --arm64
                      artifact_name: macos-installers
                      artifact_files: dist/*.dmg
                    - os: ubuntu-latest
                      build_args: --linux AppImage --x64
                      artifact_name: linux-installer
                      artifact_files: dist/*.AppImage
              runs-on: ${{ matrix.os }}
              env:
                CSC_IDENTITY_AUTO_DISCOVERY: "false"
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm ci
                - run: npx electron-builder ${{ matrix.build_args }} --publish never
                - uses: actions/upload-artifact@v4
                  with:
                    name: ${{ matrix.artifact_name }}
                    path: ${{ matrix.artifact_files }}
                    if-no-files-found: error

            publish:
              if: startsWith(github.ref, 'refs/tags/')
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/download-artifact@v4
                  with:
                    path: release-assets
                    merge-multiple: true
                - name: Create GitHub release
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "OSC Bridge $GITHUB_REF_NAME"
          '''
          release = '\n'.join(line[10:] if line.startswith('          ') else line for line in release.splitlines()) + '\n'
          Path('.github/workflows/release.yml').write_text(release)
          PY
      - name: Generate reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/finalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize reproducible v2 release"
          git push origin HEAD:agent/finalize-v2-release
