name: Verify Palm Cove Table Tennis v2.2.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-table-tennis-v2-2-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for published cross-platform installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 48); do
            if gh release view v2.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > /tmp/release.json 2>/dev/null; then
              DRAFT=$(jq -r '.isDraft' /tmp/release.json)
              PRERELEASE=$(jq -r '.isPrerelease' /tmp/release.json)
              ASSETS=$(jq '.assets | length' /tmp/release.json)
              if [ "$DRAFT" = "false" ] && [ "$PRERELEASE" = "false" ] && [ "$ASSETS" -ge 4 ]; then
                jq -r '.assets[].name' /tmp/release.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "v2.2.0 did not publish four installer assets in time" >&2
          exit 1

      - name: Publish final release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## Palm Cove Table Tennis

          OSC Bridge v2.2.0 replaces the earlier Pong prototype with a completely original clean-room motion-controlled table-tennis game.

          ### Highlights
          - Solo mode with four original opponents and five adjustable CPU levels
          - Two-player local matches using two real phones
          - Independent motion calibration, handedness, sensitivity, smoothing, and Player 2 mirroring
          - Forehand/backhand recognition, power, directional placement, topspin, backspin, and sidespin
          - Gravity, drag, Magnus-force curvature, table bounces, net contact, legal serves, lets, service rotation, win-by-two scoring, and match presets
          - Original Palm Cove vacation-resort visuals and synthesized sound feedback
          - Mouse, keyboard, touch, and phone-button fallbacks
          - Reduced-motion, high-contrast, assist, volume, and camera settings
          - Automated physics, clean-room, Electron renderer, and packaging verification

          The release contains installers for Windows, Linux, Intel macOS, and Apple Silicon macOS. The applications are not code-signed, so operating systems may display an unidentified-developer warning.

          Real-device acceptance with your specific computer and phones remains the final hardware validation step.
          EOF
          gh release edit v2.2.0 --repo "$GITHUB_REPOSITORY" --title "OSC Bridge v2.2.0 — Palm Cove Table Tennis" --notes-file /tmp/notes.md

      - name: Remove verifier
        run: |
          rm .github/workflows/verify-table-tennis-v2-2-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "verify Palm Cove Table Tennis v2.2.0 release"
          git push origin HEAD:main
