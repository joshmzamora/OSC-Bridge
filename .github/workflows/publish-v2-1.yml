name: Publish OSC Bridge v2.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v2-1.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize release commit and tag
        run: |
          rm .github/workflows/publish-v2-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "prepare OSC Bridge v2.1.0 release"
          git push origin HEAD:main
          git tag -a v2.1.0 HEAD -m "OSC Bridge v2.1.0"
          git push origin refs/tags/v2.1.0

      - name: Locate release workflow
        id: release_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch v2.1.0 \
              --event push \
              --limit 10 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch == "v2.1.0")][0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for installers and release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Record verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,displayTitle,headBranch,headSha,status,conclusion,url,jobs \
            > /tmp/run.json
          gh release view v2.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,publishedAt,url,assets \
            > /tmp/release.json

          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile run /tmp/run.json \
            --slurpfile release /tmp/release.json \
            '{checkedAt: $checkedAt, run: $run[0], release: $release[0]}' \
            > release-v2.1-status.json

          test "$(jq -r '.run.conclusion' release-v2.1-status.json)" = "success"
          test "$(jq -r '.release.isDraft' release-v2.1-status.json)" = "false"
          test "$(jq -r '.release.assets | length >= 4' release-v2.1-status.json)" = "true"

          git pull --rebase origin main
          git add release-v2.1-status.json
          git commit -m "record successful v2.1.0 release"
          git push origin HEAD:main
