name: Verify v2.2.1 release assets

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-v2-2-1-release.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v2.2.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets > release-v2-2-1-verified.json
      - name: Validate assets
        run: |
          test "$(jq -r '.isDraft' release-v2-2-1-verified.json)" = false
          test "$(jq -r '.isPrerelease' release-v2-2-1-verified.json)" = false
          test "$(jq '.assets | length' release-v2-2-1-verified.json)" -ge 4
      - name: Commit verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-v2-2-1-verified.json
          git commit -m "verify v2.2.1 release assets"
          git pull --rebase origin main
          git push origin HEAD:main
