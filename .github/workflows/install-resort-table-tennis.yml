name: Install resort table tennis

on:
  push:
    branches: ["agent/resort-table-tennis"]
    paths:
      - .github/workflows/install-resort-table-tennis.yml

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/resort-table-tennis
      - name: Install clean-room table-tennis implementation
        run: |
          cat .table-tennis-upload/part-* > /tmp/resort-table-tennis.b64
          base64 --decode /tmp/resort-table-tennis.b64 > /tmp/resort-table-tennis.tar.gz
          tar -xzf /tmp/resort-table-tennis.tar.gz -C .
          rm -rf .table-tennis-upload
          rm .github/workflows/install-resort-table-tennis.yml
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript
        run: npm run check
      - name: Run unit and integration tests
        run: npm test
      - name: Run Electron renderer end-to-end smoke test
        run: xvfb-run -a npm run e2e:table-tennis
      - name: Package Linux application smoke test
        run: npx electron-builder --dir --linux
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build polished motion table tennis"
          git push origin HEAD:agent/resort-table-tennis
