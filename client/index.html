<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSC Bridge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="sketch"></iframe>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const iframe = document.querySelector("iframe#sketch");
            iframe.onload = () => OSC.startOSCBridge(iframe);
            iframe.src = new URLSearchParams(window.location.search).get('sketch');
        });
    </script>
</body>
</html>
